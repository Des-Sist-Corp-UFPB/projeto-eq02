version: '3.8'

services:
  api:
    image: ${APP_IMAGE:-financia-api:latest}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ping')\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - levius-network

networks:
  levius-network:
    driver: bridge