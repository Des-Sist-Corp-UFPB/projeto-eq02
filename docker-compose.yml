version: '3.8'

services:
  api:
    image: ${APP_IMAGE:-financia-api:latest}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    env_file:
      - .env
    networks:
      - levius-network

networks:
  levius-network:
    driver: bridge