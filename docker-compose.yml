version: '3.8'

services:
  api:
    image: ${APP_IMAGE:-financia-api:latest}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - FORCE_RECREATE=1
      - DEPLOY_REVISION=3
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8080/ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 300s
    networks:
      - levius-network

networks:
  levius-network:
    driver: bridge