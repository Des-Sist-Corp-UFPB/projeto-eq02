# =============================================================================
# GitHub Actions — Build, Segurança e Deploy
# =============================================================================
name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  # ============================================================================
  # JOB 1 — Análise de segurança (SAST e dependências)
  # ============================================================================
  test-and-sast:
    name: Testes e SAST
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Trivy — scan de dependências e segredos
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: library
          scanners: vuln,secret

  # ============================================================================
  # JOB 2 — Build da imagem Docker de produção e push para GHCR
  # ============================================================================
  build-and-push:
    name: Build e push da imagem
    runs-on: ubuntu-latest
    needs: test-and-sast

    permissions:
      contents: read
      packages: write

    outputs:
      image-tags: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Extrair metadados para Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e push para o GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # JOB 3 — Deploy no servidor via SSH
  # ============================================================================
  deploy:
    name: Deploy em produção
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Copiar docker-compose.yml para o servidor
        uses: appleboy/scp-action@v0.1.7
        with:
          host: dsc.rodrigor.com
          username: ghactions
          key: ${{ secrets.SSH_DEPLOY_KEY }}
          source: docker-compose.yml
          target: /home/ghactions/financia/

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE_FULL: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        with:
          host: dsc.rodrigor.com
          username: ghactions
          key: ${{ secrets.SSH_DEPLOY_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,IMAGE_FULL
          script_stop: true
          script: |
            set -euo pipefail

            DEPLOY_DIR="/home/ghactions/financia"
            COMPOSE_FILE="$DEPLOY_DIR/docker-compose.yml"

            echo "======================================================"
            echo " Deploy iniciado: $(date)"
            echo " Imagem: $IMAGE_FULL"
            echo "======================================================"

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            echo "✓ Autenticado no GHCR"

            docker pull "$IMAGE_FULL"
            echo "✓ Imagem baixada: $IMAGE_FULL"

            cd "$DEPLOY_DIR"
            
            # Garante que as configurações do novo banco estejam no .env de produção
            grep -q "^DB_HOST=" .env 2>/dev/null || echo "DB_HOST=postgres" >> .env
            grep -q "^DB_PORT=" .env 2>/dev/null || echo "DB_PORT=5432" >> .env
            grep -q "^DB_NAME=" .env 2>/dev/null || echo "DB_NAME=eq02" >> .env
            grep -q "^DB_USER=" .env 2>/dev/null || echo "DB_USER=eq02" >> .env
            
            # Se a senha ainda não estiver configurada no .env ou estiver vazia, configura a correta
            if ! grep -q "^DB_PASSWORD=" .env 2>/dev/null; then
              echo "DB_PASSWORD=k972b3p4mwj6Myw9nhx3" >> .env
            else
              sed -i "s|^DB_PASSWORD=.*|DB_PASSWORD=k972b3p4mwj6Myw9nhx3|" .env
            fi

            if grep -q "^APP_IMAGE=" .env 2>/dev/null; then
              sed -i "s|^APP_IMAGE=.*|APP_IMAGE=$IMAGE_FULL|" .env
            else
              echo "APP_IMAGE=$IMAGE_FULL" >> .env
            fi
            echo "✓ .env atualizado com APP_IMAGE=$IMAGE_FULL"

            echo "Reiniciando container da api..."
            docker compose -f "$COMPOSE_FILE" up -d \
              --force-recreate \
              api
            echo "✓ Container reiniciado"

            echo "Aguardando a aplicação ficar saudável na porta 8102 (máx. 90s)..."
            for i in $(seq 1 18); do
              # Teste usando curl (-L para seguir redirect que a API faz pra /static/login.html)
              if curl -s -L -o /dev/null -w "%{http_code}" http://localhost:8102/ | grep -q '^\(200\|307\)$'; then
                echo "✓ Aplicação saudável! ($(( i * 5 ))s)"
                break
              fi
              if [ "$i" -eq 18 ]; then
                echo "✗ ERRO: aplicação não ficou saudável após 90 segundos"
                echo "--- Últimas 80 linhas do log da aplicação ---"
                docker compose -f "$COMPOSE_FILE" logs --tail 80 api
                exit 1
              fi
              echo "  aguardando... ($i/18, $(( i * 5 ))s)"
              sleep 5
            done

            docker image prune -f > /dev/null
            echo "✓ Imagens antigas removidas"
            echo "======================================================"
            