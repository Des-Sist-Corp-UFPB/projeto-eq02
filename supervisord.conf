[supervisord]
nodaemon=true
user=root

[program:mcp]
command=opentelemetry-instrument python mcp_server.py
autostart=true
autorestart=true
priority=10
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:uvicorn]
command=opentelemetry-instrument uvicorn api_server:app --host 0.0.0.0 --port 8080 --ws websockets
autostart=true
autorestart=true
priority=10
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
